# Cloudflare Pages project that puts Call Coach on a branded address (callcoach.rockstarcrm.app).
# Pages accepts a CNAME from DNS hosted outside Cloudflare, which a Worker custom domain does not.
name = "rockstar-call-coach"
pages_build_output_dir = "./public"
compatibility_date = "2026-10-01"

[[services]]
binding = "COACH"
service = "rockstar-ai-audit"
