<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Social share: AI Audit complete</title>
<style>
	* { box-sizing: border-box; margin: 0; padding: 0; }
	html, body { width: 1200px; height: 630px; overflow: hidden; }
	body {
		font-family: Arial, Helvetica, sans-serif; color: #10233d; position: relative;
		background: radial-gradient(800px 600px at 1050px 520px, #e0f3ec 0%, rgba(224,243,236,0) 65%), linear-gradient(120deg, #f4f8fb 0%, #eef5f4 100%);
	}
	.pill { position: absolute; left: 72px; top: 137px; background: #10233d; color: #6fe0bb; font-weight: bold; font-size: 17px; letter-spacing: 1.8px;
		padding: 11px 20px 11px 18px; border-radius: 999px; display: flex; align-items: center; gap: 10px; }
	.pill i { width: 10px; height: 10px; border-radius: 50%; background: #19b986; display: inline-block; }
	h1 { position: absolute; left: 72px; top: 200px; width: 560px; font-size: 64px; line-height: 1.04; letter-spacing: -2px; font-weight: bold; }
	h1 em { font-style: normal; color: #138b68; }
	.sub { position: absolute; left: 72px; top: 362px; width: 520px; font-size: 23px; line-height: 1.45; color: #4a5d73; }
	.powered { position: absolute; left: 72px; top: 556px; display: flex; align-items: center; gap: 10px; font-weight: bold; font-size: 15px; color: #5b6b7d; }
	.powered img { width: 32px; height: 32px; }

	.phone { position: absolute; left: 752px; top: 48px; width: 340px; height: 560px; border-radius: 44px; background: #10233d; padding: 14px;
		transform: rotate(-3deg); box-shadow: 0 30px 60px rgba(16,35,61,.25); }
	.screen { width: 100%; height: 100%; border-radius: 32px; background: #fff; overflow: hidden; }
	.top { background: #10233d; height: 74px; display: flex; align-items: center; gap: 12px; padding: 0 22px; }
	.top b { width: 30px; height: 30px; border-radius: 8px; background: #19b986; }
	.top span { width: 120px; height: 9px; border-radius: 99px; background: #5b6f87; }
	.body { padding: 22px; }
	.hello { font-size: 13px; font-weight: bold; letter-spacing: 1.6px; color: #138b68; }
	.line { height: 14px; border-radius: 99px; background: #e5eaf0; margin-top: 12px; }
	.report { margin-top: 20px; background: #10233d; border-radius: 18px; padding: 18px; color: #fff; }
	.report small { display: block; font-size: 11.5px; letter-spacing: 1.6px; font-weight: bold; color: #6fe0bb; }
	.report strong { display: block; font-size: 38px; letter-spacing: -1px; margin-top: 6px; }
	.report strong em { font-style: normal; font-size: 17px; color: #b8c7d6; letter-spacing: 0; }
	.btn { margin-top: 14px; background: #19b986; border-radius: 12px; padding: 13px; text-align: center; font-weight: bold; font-size: 15px; }
	.row { display: flex; gap: 8px; margin-top: 18px; }
	.row span { flex: 1; height: 36px; border-radius: 10px; border: 1.5px solid #e1e7ee; }
	.row span.on { background: #10233d; border-color: #10233d; }
	.check { position: absolute; left: 1036px; top: 312px; width: 92px; height: 92px; border-radius: 50%; background: #19b986; border: 6px solid #fff;
		box-shadow: 0 12px 30px rgba(25,185,134,.45); display: grid; place-items: center; }
</style>
</head>
<body>
	<div class="pill"><i></i>AUDIT COMPLETE</div>
	<h1>Your AI Audit is <em>complete.</em></h1>
	<p class="sub">Your personalized plan from Rockstar is on the way. Grab a time to walk through it.</p>
	<div class="powered"><img src="rockstar-logo-56.png" alt="">Powered by Rockstar</div>

	<div class="phone"><div class="screen">
		<div class="top"><b></b><span></span></div>
		<div class="body">
			<div class="hello">YOUR AI AUDIT</div>
			<div class="line" style="width:88%"></div>
			<div class="line" style="width:62%"></div>
			<div class="report">
				<small>OPPORTUNITY SCORE</small>
				<strong>8 <em>/ 10</em></strong>
				<div class="btn">Book my Strategy Call</div>
			</div>
			<div class="row"><span></span><span class="on"></span><span></span></div>
			<div class="line" style="width:94%;margin-top:22px"></div>
			<div class="line" style="width:70%"></div>
		</div>
	</div></div>
	<div class="check"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
</body>
</html>
