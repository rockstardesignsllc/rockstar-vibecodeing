# Reads each brand's public offer pages every Monday, commits any new or changed factory offers to main, and
# publishes them to the Deal Desk. There is no approval step: collect.mjs holds back offers outside its sanity
# limits, and each run's report is committed to payment-calculator/offers/reports/.
name: Weekly rebate offers

on:
  schedule:
    - cron: '0 11 * * 1'
  workflow_dispatch:
    inputs:
      brand:
        description: 'One brand to collect (blank = all), e.g. polaris'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: offers-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    defaults:
      run:
        working-directory: payment-calculator/offers
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: payment-calculator/offers/package-lock.json

      - run: npm ci --no-audit --no-fund

      - run: npx playwright install --with-deps chromium

      - name: Collect offers
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BRAND: ${{ inputs.brand }}
        run: node collect.mjs ${BRAND:+--brand "$BRAND"}

      - name: Add the run summary to the job page
        if: always()
        run: if [ -f last-run.md ]; then cat last-run.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Commit offers and the run report to main
        id: commit
        run: |
          mkdir -p reports
          cp last-run.md "reports/$(date -u +%F).md"
          git add data reports
          if git diff --cached --quiet -- data; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "Deal Desk offers: weekly update $(date -u +%F)"
          # main often moves while the collector runs (it takes several minutes), so replay this commit on the
          # newest main before each push. Only data/ and reports/ change here, so the rebase is normally clean.
          for attempt in 1 2 3 4; do
            git fetch origin main
            if ! git rebase FETCH_HEAD; then
              git rebase --abort
              echo "::error::Offers commit conflicts with main. Resolve payment-calculator/offers/data by hand."
              exit 1
            fi
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 5))
          done
          echo "::error::Could not push the offers commit to main after 4 attempts."
          exit 1

  publish:
    needs: collect
    if: needs.collect.outputs.changed == 'true'
    uses: ./.github/workflows/offers-publish.yml
    with:
      ref: main
