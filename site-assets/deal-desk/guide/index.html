<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>How-to Guide</title>
<style>body{margin:0;background:#f4f4f6;font:16px/1.5 Inter,Arial,sans-serif;color:#0b0b0d}main{max-width:560px;margin:60px auto;padding:28px 24px;background:#fff;border-radius:20px}a{display:block;margin:10px 0;padding:14px 18px;border:2px solid #e3e4e8;border-radius:14px;color:#0b0b0d;font-weight:700;text-decoration:none}a:hover{border-color:#d70015}</style>
</head><body><main id="pick" hidden><h1>How-to Guide</h1><p>Choose your calculator.</p>
<a href="standard">Payment Calculator</a><a href="subprime">Sub-Prime Payment Calculator</a><a href="powersports">Powersports Deal Desk</a></main>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var client = (q.get('client') || '').replace(/[^a-z0-9-]/g, '');
  function go(kind) { location.replace(kind + location.search + location.hash); }
  function pick() { document.getElementById('pick').hidden = false; }
  if (!client) return pick();
  fetch('../clients/' + client + '.json', { cache: 'no-cache' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (c) {
      if (String(c.vertical || '').toLowerCase() === 'powersports') return go('powersports');
      go(String(c.calculatorType || '').toLowerCase() === 'subprime' ? 'subprime' : 'standard');
    })
    .catch(pick);
})();
</script></body></html>
