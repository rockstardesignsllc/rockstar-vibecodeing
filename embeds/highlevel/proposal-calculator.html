<!--
  Rockstar Customer Engagement Calculator
  Paste this entire file into a HighLevel "Custom HTML/JS" element.
  - Without query parameters it renders the dealer workspace (proposal builder).
  - With ?proposal=1&p=<data> it renders the customer-facing proposal.
-->
<div id="afp-tool"></div>

<style>
#afp-tool{--navy:#10233d;--mint:#19b986;--mint-dark:#138b68;--ink:#172235;--muted:#637286;--line:#dbe2ea;font-family:Arial,Helvetica,sans-serif;color:var(--ink);max-width:1120px;margin:24px auto}
#afp-tool *{box-sizing:border-box}
#afp-tool button,#afp-tool input,#afp-tool select{font:inherit}
#afp-tool p{line-height:1.55;color:var(--muted)}
#afp-tool h2{font-size:32px;letter-spacing:-1px;margin:0 0 10px;line-height:1.1}
#afp-tool button{border:0;border-radius:7px;padding:12px 16px;background:var(--mint);color:#fff;font-weight:800;cursor:pointer;text-decoration:none;font-size:14px}
#afp-tool .afp-kicker{color:var(--mint-dark);font-size:11px;font-weight:800;letter-spacing:.13em;margin:0 0 10px}
#afp-tool .afp-label,#afp-tool .afp-field{font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:#526174;display:block}
#afp-tool .afp-field input,#afp-tool .afp-field select{width:100%;border:1px solid var(--line);border-radius:7px;margin-top:6px;padding:10px;color:var(--ink);background:#fff;outline-color:var(--mint);font-size:14px;letter-spacing:0;text-transform:none}

#afp-tool .afp-brand{display:flex;align-items:center;gap:12px;color:#fff;background:var(--navy);padding:16px 20px;border-radius:12px 12px 0 0}
#afp-tool .afp-brand span{font-size:11px;letter-spacing:.12em;opacity:.65;margin-left:auto;text-align:right}
#afp-tool .afp-mark{width:36px;height:36px;border-radius:8px;background:var(--mint);color:var(--navy);display:grid;place-items:center;font-weight:900;flex:none}
#afp-tool .afp-logo{height:40px;max-width:150px;object-fit:contain;background:#fff;border-radius:6px;padding:3px;flex:none}

#afp-tool .afp-wrap{background:#f5f7fa;padding:28px;border-radius:18px}
#afp-tool .afp-intro{padding:30px 0 20px;max-width:660px}
#afp-tool .afp-card{background:#fff;border:1px solid #e4e9ef;border-radius:13px;padding:24px;box-shadow:0 10px 30px #132f4b0b}
#afp-tool .afp-section{font-size:15px;margin:26px 0 12px;padding-top:20px;border-top:1px solid #e7ebf0;color:var(--navy)}
#afp-tool .afp-section:first-child{margin-top:0;padding-top:0;border:0}
#afp-tool .afp-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
#afp-tool .afp-hint{font-size:12px;margin:0 0 12px}
#afp-tool .afp-note{font-size:11px;margin:14px 0 0}
#afp-tool .afp-checks{display:flex;flex-direction:column;justify-content:flex-end;gap:10px}
#afp-tool .afp-check{display:flex;align-items:center;gap:9px;font-size:14px;color:var(--ink);cursor:pointer}
#afp-tool .afp-check input{width:18px;height:18px;margin:0;accent-color:var(--mint)}
#afp-tool .afp-term-picks{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:14px}
#afp-tool .afp-chip{display:flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);border-radius:7px;padding:10px 4px;font-size:13px;font-weight:700;cursor:pointer}
#afp-tool .afp-chip:has(input:checked){border-color:var(--mint);background:#eef8f5}
#afp-tool .afp-chip input{margin:0;accent-color:var(--mint)}
#afp-tool .afp-summary{display:grid;grid-template-columns:1fr auto;gap:8px;background:#eef8f5;border-radius:9px;padding:16px;margin:24px 0 20px;color:#536a73;font-size:13px}
#afp-tool .afp-summary strong{font-size:16px;color:var(--navy);text-align:right}
#afp-tool .afp-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#afp-tool .afp-link{border-radius:7px;padding:12px 16px;background:#edf1f5;color:#263950;font-weight:800;text-decoration:none;font-size:14px}
#afp-tool .afp-text-btn{background:none;color:var(--mint-dark);padding:0;font-size:11px;text-decoration:underline}

#afp-tool .afp-customer{background:#f6f8fa;padding:0 0 24px;border-radius:12px;overflow:hidden}
#afp-tool .afp-customer .afp-brand{border-radius:0}
#afp-tool .afp-hero{padding:38px 30px;display:flex;justify-content:space-between;gap:20px;align-items:end;background:#fff}
#afp-tool .afp-hero h2{font-size:34px}
#afp-tool .afp-sub{font-size:14px;margin:0}
#afp-tool .afp-price{text-align:right}
#afp-tool .afp-price small{display:block;color:var(--muted);font-size:12px}
#afp-tool .afp-price strong{font-size:27px;display:block;margin:5px 0}
#afp-tool .afp-calculator{margin:0 20px;background:#fff;border-radius:13px;overflow:hidden;display:grid;grid-template-columns:.8fr 1.2fr;box-shadow:0 10px 30px #132f4b10}
#afp-tool .afp-payment{background:var(--navy);color:#fff;padding:34px}
#afp-tool .afp-payment .afp-kicker{color:#71e4bd}
#afp-tool .afp-payment .afp-label{color:#9fb2c4;margin-top:18px}
#afp-tool .afp-payment-value{font-size:44px;font-weight:800;letter-spacing:-1.8px}
#afp-tool .afp-payment-value span{font-size:14px;color:#c3d0dc;letter-spacing:0}
#afp-tool .afp-payment p{color:#c1ceda;font-size:13px}
#afp-tool .afp-payment .afp-request{width:100%;margin-top:22px}
#afp-tool .afp-payment .afp-save{width:100%;margin-top:10px;background:transparent;border:1px solid #71e4bd;color:#71e4bd}
#afp-tool .afp-payment .afp-save-hint{font-size:11px;text-align:center;margin:8px 0 0;color:#9fb2c4}
#afp-tool .afp-controls{padding:30px}
#afp-tool .afp-control{padding-bottom:22px;margin-bottom:22px;border-bottom:1px solid #e7ebf0}
#afp-tool .afp-control:last-child{border:0;margin:0;padding:0}
#afp-tool .afp-control-head{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:800}
#afp-tool .afp-control-head b{font-size:15px}
#afp-tool .afp-locked{font-size:12px;margin:8px 0 0}
#afp-tool input[type=range]{width:100%;accent-color:var(--mint);padding:0;margin:14px 0 0}
#afp-tool .afp-term-buttons{display:grid;grid-template-columns:repeat(auto-fit,minmax(56px,1fr));gap:6px;margin-top:15px}
#afp-tool .afp-term-buttons button{padding:8px 2px;background:#fff;border:1px solid var(--line);color:#596779;font-size:12px}
#afp-tool .afp-term-buttons button.on{background:var(--navy);border-color:var(--navy);color:#fff}
#afp-tool .afp-disclaimer{font-size:11px;line-height:1.6;color:#728093;padding:20px 30px 0}
#afp-tool .afp-disclaimer strong{color:#445466}

@media(max-width:700px){
  #afp-tool .afp-wrap{padding:15px}
  #afp-tool .afp-grid{grid-template-columns:1fr}
  #afp-tool .afp-term-picks{grid-template-columns:repeat(3,1fr)}
  #afp-tool .afp-brand span{display:none}
  #afp-tool .afp-hero{display:block;padding:28px 22px}
  #afp-tool .afp-hero h2{font-size:29px}
  #afp-tool .afp-price{text-align:left;margin-top:22px}
  #afp-tool .afp-calculator{grid-template-columns:1fr;margin:0 12px}
  #afp-tool .afp-payment,#afp-tool .afp-controls{padding:25px 20px}
}
</style>

        const picked = (Array.isArray(v) ? v : String(v).split(',')).map(Number);
        const allowed = TERMS.filter(t => picked.includes(t));
        if (allowed.length) out.terms = allowed;
      } else if (typeof defaults[k] === 'boolean') {
        out[k] = v === true || v === '1' || v === 'true';
      } else {
        out[k] = String(v);
      }
    });
    out.term = closestTerm(out.term,out.terms);
    if (out.hideRate) out.lockRate = false;
    return out;
  }

  const loadProfile = () => {
    try {
      const saved = JSON.parse(localStorage.getItem(PROFILE_STORAGE_KEY) || '{}');
      return Object.fromEntries(PROFILE_KEYS.filter(k => typeof saved[k] === 'string').map(k => [k,saved[k]]));
    } catch { return {}; }
  };
  const saveProfile = () => {
    try {
      localStorage.setItem(PROFILE_STORAGE_KEY,JSON.stringify(Object.fromEntries(PROFILE_KEYS.map(k => [k,d[k]]))));
    } catch { /* storage unavailable; the form still works without it */ }
  };
  const clearProfile = () => {
    try { localStorage.removeItem(PROFILE_STORAGE_KEY); } catch { /* storage unavailable */ }
  };

  const q = new URLSearchParams(location.search);
  const isCustomer = q.get('proposal') === '1';

  function readProposal() {
    if (!q.has('p')) return normalize(Object.fromEntries(q));
    try { return normalize(JSON.parse(fromBase64Url(q.get('p')))); } catch { return null; }
  }

  let d = isCustomer ? readProposal() : normalize({...defaults,...loadProfile()});

  const totalPrice = () => num(d.price) + num(d.tax) + num(d.fees);
  const maxDown = () => Math.max(0,totalPrice() - MIN_FINANCED);
  const effectiveDown = () => Math.max(0,Math.min(maxDown(),num(d.down)));
  const clampDown = () => { d.down = effectiveDown(); };
  const monthly = () => payment(totalPrice() - effectiveDown(),d.rate,d.term);
  const dealerName = () => d.dealer || 'Your dealership';
  const vehicleName = () => [d.year,d.make,d.model].filter(Boolean).join(' ');
  const mileageText = () => d.mileage === '' ? '' :
    (Number.isFinite(+d.mileage) ? Number(d.mileage).toLocaleString('en-US') : d.mileage) + ' miles';

  const dealerLogo = () => d.logo
    ? `<img class="afp-logo" src="${esc(d.logo)}" alt="${esc(dealerName())} logo" onerror="this.style.display='none'">`
    : `<div class="afp-mark">${esc(dealerName().charAt(0).toUpperCase())}</div>`;

  const disclaimerText = () =>
    'This estimate is for informational purposes only and is not an offer to finance, credit decision, ' +
    'or guarantee of financing. It is based on the APR, term, down payment, vehicle price, taxes, and fees ' +
    'shown. Actual payment, APR, amount financed, required down payment, taxes, fees, lender terms, vehicle ' +
    'price, and availability may change based on credit approval, lender requirements, verification, final ' +
    `contract terms, and prior sale. Contact ${dealerName()} to confirm all details before making a purchase decision.`;

  function estimateRows() {
    const rows = [
      ['Purchase price',money(d.price)],
      ['Tax',money(d.tax)],
      ['Title, registration & dealer fees',money(d.fees)],
      ['Total price',money(totalPrice())],
      ['Down payment',money(d.down)],
      ['Amount financed',money(totalPrice() - d.down)]
    ];
    if (!d.hideRate) rows.push(['APR',percent(d.rate)]);
    rows.push(['Term',`${d.term} months`],['Estimated monthly payment',money(monthly())]);
    return rows;
  }

  function field(key,label,type='text',placeholder='') {
    return `<label class="afp-field">${label}<input data-key="${key}" type="${type}" value="${esc(d[key])}" placeholder="${esc(placeholder)}"></label>`;
  }

  function checkbox(flag,label) {
    return `<label class="afp-check"><input type="checkbox" data-flag="${flag}" ${d[flag] ? 'checked' : ''}>${label}</label>`;
  }

  const proposalUrl = () => `${location.origin}${location.pathname}?proposal=1&p=${toBase64Url(JSON.stringify(d))}`;

  function builder() {
    root.innerHTML = `
      <div class="afp-wrap">
        <div class="afp-brand">
          <img class="afp-logo" src="${ROCKSTAR_LOGO}" alt="Rockstar logo">
          <b>Rockstar Customer Engagement Calculator</b>
          <span>DEALER WORKSPACE</span>
        </div>
        <div class="afp-intro">
          <p class="afp-kicker">PERSONALIZED FINANCING</p>
          <h2>Create a proposal your customer can explore.</h2>
          <p>Fill in the details, copy the link, and send it to your customer.</p>
        </div>
        <div class="afp-card">
          <h3 class="afp-section">Dealership</h3>
          <div class="afp-grid">
            ${field('dealer','Dealer name','text','Your dealership')}
            ${field('email','Dealer notification email','email')}
            ${field('logo','Dealer logo image URL (optional)','url','https://...')}
          </div>
          <p class="afp-note">Dealer name, email, and logo are remembered on this device.
            <button type="button" class="afp-text-btn" id="afp-forget">Forget saved dealer info</button></p>

          <h3 class="afp-section">Customer &amp; vehicle</h3>
          <div class="afp-grid">
            ${field('name','Customer first name')}
            ${field('stock','Stock number')}
            ${field('year','Year')}
            ${field('make','Make')}
            ${field('model','Model / trim')}
            ${field('mileage','Mileage')}
          </div>

          <h3 class="afp-section">Pricing</h3>
          <div class="afp-grid">
            ${field('price','Purchase price','number')}
            ${field('tax','Tax','number')}
            ${field('fees','Title, registration & dealer fees','number')}
            ${field('down','Starting down payment','number')}
          </div>

          <h3 class="afp-section">Interest rate</h3>
          <div class="afp-grid">
            ${field('rate','Default APR (%)','number')}
            <div class="afp-checks">
              ${checkbox('hideRate','Do not show interest rate')}
              ${checkbox('lockRate','Display rate but customer cannot edit')}
            </div>
          </div>

          <h3 class="afp-section">Finance term</h3>
          <p class="afp-hint">Check the terms your customer can choose from. Check only one to lock the term.</p>
          <div class="afp-term-picks">
            ${TERMS.map(t => `<label class="afp-chip"><input type="checkbox" data-term-allow="${t}" ${d.terms.includes(t) ? 'checked' : ''}>${t} mo</label>`).join('')}
          </div>
          <div class="afp-grid">
            <label class="afp-field">Starting term<select id="afp-term-default"></select></label>
          </div>

          <div class="afp-summary">
            <span>Total price</span><strong id="afp-total"></strong>
            <span>Estimated payment</span><strong id="afp-start-payment"></strong>
          </div>
          <div class="afp-actions">
            <button type="button" id="afp-copy">Copy personalized link</button>
            <a id="afp-preview" class="afp-link" target="_blank" rel="noopener">Preview proposal</a>
          </div>
          <p class="afp-note">The customer's Request button opens their email app with the dealer's address and selected proposal prefilled.</p>
        </div>
      </div>`;

    const termSelect = root.querySelector('#afp-term-default');

    const refresh = () => {
      termSelect.innerHTML = d.terms
        .map(t => `<option value="${t}" ${t === d.term ? 'selected' : ''}>${t} months</option>`).join('');
      root.querySelector('#afp-total').textContent = money(totalPrice());
      root.querySelector('#afp-start-payment').textContent = money(monthly()) + '/mo';
      root.querySelector('#afp-preview').href = proposalUrl();
    };

    root.querySelectorAll('input[data-key]').forEach(el => {
      el.addEventListener('input',() => {
        const key = el.dataset.key;
        d[key] = NUMERIC_KEYS.includes(key) ? num(el.value) : el.value;
        if (PROFILE_KEYS.includes(key)) saveProfile();
        refresh();
      });
    });

    root.querySelectorAll('input[data-flag]').forEach(el => {
      el.addEventListener('change',() => {
        d[el.dataset.flag] = el.checked;
        if (el.checked) {
          root.querySelectorAll('input[data-flag]').forEach(other => {
            if (other !== el) { other.checked = false; d[other.dataset.flag] = false; }
          });
        }
        refresh();
      });
    });

    root.querySelectorAll('input[data-term-allow]').forEach(el => {
      el.addEventListener('change',() => {
        const allowed = TERMS.filter(t => root.querySelector(`[data-term-allow="${t}"]`).checked);
        if (!allowed.length) { el.checked = true; return; }
        d.terms = allowed;
        d.term = closestTerm(d.term,allowed);
        refresh();
      });
    });

    termSelect.addEventListener('change',() => {
      d.term = num(termSelect.value,d.terms[0]);
      refresh();
    });

    root.querySelector('#afp-forget').onclick = () => {
      clearProfile();
      PROFILE_KEYS.forEach(k => { d[k] = ''; });
      builder();
    };

    const copyButton = root.querySelector('#afp-copy');
    copyButton.onclick = () => navigator.clipboard.writeText(proposalUrl()).then(() => {
      copyButton.textContent = 'Link copied';
      setTimeout(() => { copyButton.textContent = 'Copy personalized link'; },2000);
    });

    refresh();
  }

  function rateControl() {
    if (d.hideRate) return '';
    if (d.lockRate) return `
      <div class="afp-control">
        <div class="afp-control-head"><span class="afp-label">Interest rate</span><b>${percent(d.rate)}</b></div>
        <p class="afp-locked">Rate set by ${esc(dealerName())}</p>
      </div>`;
    return `
      <div class="afp-control">
        <div class="afp-control-head"><span class="afp-label">Interest rate</span><b id="afp-rate-value"></b></div>
        <input id="afp-rate-slider" type="range" min="0" max="${Math.max(20,Math.ceil(d.rate))}" step=".01" value="${d.rate}">
      </div>`;
  }

  function termControl() {
    if (d.terms.length === 1) return `
      <div class="afp-control">
        <div class="afp-control-head"><span class="afp-label">Finance term</span><b>${d.term} months</b></div>
        <p class="afp-locked">Term set by ${esc(dealerName())}</p>
      </div>`;
    return `
      <div class="afp-control">
        <div class="afp-control-head"><span class="afp-label">Finance term</span><b id="afp-term-value"></b></div>
        <div class="afp-term-buttons">
          ${d.terms.map(t => `<button type="button" data-term="${t}">${t}</button>`).join('')}
        </div>
      </div>`;
  }

  function printableProposal() {
    const logo = d.logo ? `<img src="${esc(d.logo)}" alt="" onerror="this.remove()">` : '';
    const rows = estimateRows().map(([label,value],i,all) =>
      `<tr class="${i === all.length-1 ? 'total' : ''}"><td>${esc(label)}</td><td>${esc(value)}</td></tr>`).join('');
    const details = [d.stock ? `Stock #${d.stock}` : '',mileageText()].filter(Boolean).join(' | ');
    const date = new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});
    return `<!doctype html><html><head><meta charset="utf-8">
      <title>${esc(`${dealerName()} proposal - ${vehicleName() || 'Vehicle'}${d.name ? ` - ${d.name}` : ''}`)}</title>
      <style>
        body{font-family:Arial,Helvetica,sans-serif;color:#172235;margin:40px;max-width:720px}
        header{display:flex;align-items:center;gap:14px;border-bottom:3px solid #10233d;padding-bottom:16px}
        header img{max-height:56px;max-width:180px;object-fit:contain}
        header h1{font-size:22px;margin:0}header p{margin:2px 0 0;color:#637286;font-size:13px}
        h2{font-size:26px;margin:28px 0 4px}.sub{color:#637286;margin:0 0 24px}
        table{width:100%;border-collapse:collapse;font-size:15px}
        td{padding:10px 0;border-bottom:1px solid #dbe2ea}td:last-child{text-align:right;font-weight:700}
        tr.total td{font-size:20px;color:#10233d;border-bottom:3px solid #19b986}
        .disclaimer{font-size:10px;line-height:1.6;color:#728093;margin-top:28px}
        @page{margin:14mm}
      </style></head><body>
      <header>${logo}<div><h1>${esc(dealerName())}</h1><p>Personalized vehicle proposal &middot; ${esc(date)}</p></div></header>
      <h2>${esc(d.name ? `${d.name}'s ` : 'Your ')}${esc(vehicleName() || 'vehicle')}</h2>
      <p class="sub">${esc(details)}</p>
      <table>${rows}</table>
      ${d.email ? `<p>Questions? Contact ${esc(dealerName())} at ${esc(d.email)}.</p>` : ''}
      <p class="disclaimer"><strong>Important financing estimate disclosure</strong><br>${esc(disclaimerText())}</p>
      </body></html>`;
  }

  function saveProposal() {
    const win = window.open('','_blank');
    if (!win) { window.print(); return; }
    win.document.open();
    win.document.write(printableProposal());
    win.document.close();
    const images = Array.from(win.document.images).map(img =>
      img.complete ? null : new Promise(resolve => { img.onload = img.onerror = resolve; }));
    Promise.all(images).then(() => { win.focus(); win.print(); });
  }

  function requestProposal() {
    const subject = encodeURIComponent(`Proposal request: ${vehicleName()}`);
    const body = encodeURIComponent(
      `Proposal request\n\nVehicle: ${vehicleName()}\nStock #: ${d.stock}\nCustomer: ${d.name}\n\n` +
      'Selected estimate\n' + estimateRows().map(([label,value]) => `${label}: ${value}`).join('\n') +
      '\n\nPlease contact me to finalize this proposal.'
    );
    location.href = `mailto:${encodeURIComponent(d.email)}?subject=${subject}&body=${body}`;
  }

  function customer() {
    clampDown();
    const total = totalPrice();
    const details = [d.stock ? `Stock #${esc(d.stock)}` : '',esc(mileageText())].filter(Boolean).join(' | ');

    root.innerHTML = `
      <div class="afp-customer">
        <div class="afp-brand">
          ${dealerLogo()}
          <b>${esc(dealerName())}</b>
          <span>PERSONALIZED VEHICLE PROPOSAL</span>
        </div>
        <div class="afp-hero">
          <div>
            <p class="afp-kicker">HELLO, ${esc((d.name || 'there').toUpperCase())}</p>
            <h2>Your ${esc(vehicleName() || 'next vehicle')}.</h2>
            <p class="afp-sub">${details}</p>
          </div>
          <div class="afp-price">
            <small>Total price</small>
            <strong>${money(total)}</strong>
            <small>Purchase ${money(d.price)} | Tax &amp; fees ${money(num(d.tax) + num(d.fees))}</small>
          </div>
        </div>
        <div class="afp-calculator">
          <div class="afp-payment">
            <p class="afp-kicker">YOUR ESTIMATED PAYMENT</p>
            <div class="afp-payment-value" id="afp-monthly"></div>
            <p>Adjust the target payment and your down payment will update automatically.</p>
            <label class="afp-label" for="afp-payment-slider">Target monthly payment</label>
            <input id="afp-payment-slider" type="range" step="5">
            <button type="button" class="afp-request" id="afp-request">Request this proposal</button>
            <button type="button" class="afp-save" id="afp-save">Save this proposal</button>
            <p class="afp-save-hint">Opens a printable copy. Choose &ldquo;Save as PDF&rdquo; as the printer.</p>
          </div>
          <div class="afp-controls">
            ${rateControl()}
            ${termControl()}
            <div class="afp-control">
              <div class="afp-control-head"><span class="afp-label">Down payment</span><b id="afp-down-value"></b></div>
              <input id="afp-down-slider" type="range" min="0" step="100">
            </div>
          </div>
        </div>
        <div class="afp-disclaimer">
          <strong>Important financing estimate disclosure</strong><br>${esc(disclaimerText())}
        </div>
      </div>`;

    const rateSlider = root.querySelector('#afp-rate-slider');
    const paymentSlider = root.querySelector('#afp-payment-slider');
    const downSlider = root.querySelector('#afp-down-slider');

    const update = () => {
      clampDown();
      const pay = monthly();
      const minPay = payment(total - maxDown(),d.rate,d.term);
      const maxPay = payment(total,d.rate,d.term);

      root.querySelector('#afp-monthly').innerHTML = `${money(pay)}<span>/ mo</span>`;
      root.querySelector('#afp-down-value').textContent = money(d.down);
      const rateValue = root.querySelector('#afp-rate-value');
      if (rateValue) rateValue.textContent = percent(d.rate);
      const termValue = root.querySelector('#afp-term-value');
      if (termValue) termValue.textContent = `${d.term} months`;

      paymentSlider.min = Math.floor(minPay/5)*5;
      paymentSlider.max = Math.ceil(maxPay/5)*5;
      paymentSlider.value = Math.min(maxPay,Math.max(minPay,pay));

      downSlider.max = maxDown();
      downSlider.value = d.down;

      root.querySelectorAll('[data-term]').forEach(b => b.classList.toggle('on',+b.dataset.term === d.term));
    };

    if (rateSlider) rateSlider.oninput = () => { d.rate = num(rateSlider.value); update(); };
    downSlider.oninput = () => { d.down = num(downSlider.value); update(); };
    paymentSlider.oninput = () => {
      d.down = downForPayment(num(paymentSlider.value),total,d.rate,d.term);
      update();
    };
    root.querySelectorAll('[data-term]').forEach(b => {
      b.onclick = () => { d.term = num(b.dataset.term); update(); };
    });
    root.querySelector('#afp-request').onclick = requestProposal;
    root.querySelector('#afp-save').onclick = saveProposal;

    update();
  }

  function invalidLink() {
    root.innerHTML = `
      <div class="afp-wrap">
        <div class="afp-card">
          <h2>This proposal link is incomplete.</h2>
          <p>Part of the link may have been cut off. Please ask your dealer to send it again.</p>
        </div>
      </div>`;
  }

  if (!isCustomer) builder();
  else if (d) customer();
  else invalidLink();
})();
</script>
