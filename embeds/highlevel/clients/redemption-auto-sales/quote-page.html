  const SUBPRIME = String(CONFIG.calculatorType || '').trim().toLowerCase() === 'subprime';
  const RATE_MODES = SUBPRIME ? ['f', 'h'] : ['t', 'f', 'h'];
  const TERMS = [24, 36, 48, 60, 72, 84];
  const TIERS = [
    { min: 781, label: 'Excellent', range: '781+' },
    { min: 721, label: 'Very good', range: '721 to 780' },
    { min: 661, label: 'Good', range: '661 to 720' },
    { min: 601, label: 'Fair', range: '601 to 660' },

  ];
  const MIN_FINANCED = 250;
  const STORE = 'rsec-dealer-profile-v2';
  const SALT = 'rockstar-engagement-v2';
  const DEF = {
    dn: '', de: '', dl: '', ac: '', wh: '', sp: '', sc: '',
    cn: '', st: '', yr: '', mk: '', md: '', mi: '',
    pr: 30000, tx: 0, fe: 0, dp: 1000, ta: 0, tb: 0, rb: 0,
    rm: SUBPRIME ? 'h' : 't', ra: 7.49, rt: [5.49, 6.49, 8.99, 12.99, 17.99], cs: 720,
    ls: '', ld: 0, lm: '', l1: 36, p1: 0, l2: 39, p2: 0,
    tm: TERMS.slice(), t: 60, id: ''
  };
  const NUM = ['pr', 'tx', 'fe', 'dp', 'ta', 'tb', 'rb', 'ra', 'cs', 't', 'ld', 'l1', 'p1', 'l2', 'p2'];
  const BLANK_WHEN_ZERO = ['rb', 'p1', 'p2'];
  const LEASE_KEYS = ['ls', 'ld', 'lm', 'l1', 'p1', 'l2', 'p2'];
  const LEASE_MAX_DOWN = 10000;
  const PROFILE = ['dn', 'de', 'dl', 'ac', 'wh', 'sp', 'sc', 'rm', 'rt'];
  const CFG_KEY = { dn: 'dealerName', de: 'dealerEmail', dl: 'dealerLogo', ac: 'accentColor', wh: 'webhookUrl' };
  const cfg = k => (CFG_KEY[k] && String(CONFIG[CFG_KEY[k]] || '').trim()) || '';
  const isLocked = k => !!cfg(k);
  const path = () => '/' + String(CONFIG.quotePagePath || '/quote').replace(/^\/+|\/+$/g, '');

  /* ---------- helpers ---------- */
  const num = (v, d = 0) => (v !== '' && v !== null && v !== undefined && Number.isFinite(+v)) ? +v : d;
  const money = n => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 })
    .format(Math.max(0, Number.isFinite(n) ? n : 0));
  const pct = n => Number(n).toFixed(2) + '%';
  const esc = v => String(v ?? '').replace(/[&<>'"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[c]));
  const clone = o => JSON.parse(JSON.stringify(o));
  const closest = (t, list) => list.reduce((b, x) => Math.abs(x - t) < Math.abs(b - t) ? x : b, list[0]);
  const b64 = s => { let bin = ''; new TextEncoder().encode(s).forEach(b => { bin += String.fromCharCode(b); }); return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); };
  const unb64 = s => { const bin = atob(s.replace(/-/g, '+').replace(/_/g, '/')); return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))); };
  const canon = o => JSON.stringify(Object.keys(o).sort().reduce((a, k) => { a[k] = o[k]; return a; }, {}));
  const fnv = (s, seed) => { let h = seed >>> 0; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; } return h.toString(16).padStart(8, '0'); };
  const sign = o => { const s = SALT + canon(o); return (fnv(s, 2166136261) + fnv(s, 3141592653)).slice(0, 12); };
  const newId = () => 'Q' + Date.now().toString(36).toUpperCase().slice(-5) + Math.floor(Math.random() * 1296).toString(36).toUpperCase().padStart(2, '0');
  const validColor = c => /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(String(c || '').trim());
  const store = {
    get() { try { return JSON.parse(localStorage.getItem(STORE) || '{}'); } catch (e) { return {}; } },
    set(o) { try { localStorage.setItem(STORE, JSON.stringify(o)); } catch (e) { /* storage unavailable */ } },
    clear() { try { localStorage.removeItem(STORE); } catch (e) { /* storage unavailable */ } }
  };

  function normalize(raw) {
    const o = clone(DEF);
    Object.keys(DEF).forEach(k => {
      const v = raw[k];
      if (v === undefined || v === null) return;
      if (NUM.includes(k)) o[k] = num(v, DEF[k]);
      else if (k === 'rt') { const a = (Array.isArray(v) ? v : String(v).split(',')).map(Number); if (a.length === 5 && a.every(Number.isFinite)) o.rt = a; }
      else if (k === 'tm') { const a = (Array.isArray(v) ? v : String(v).split(',')).map(Number); const al = TERMS.filter(t => a.includes(t)); if (al.length) o.tm = al; }
      else o[k] = String(v);
    });
    if (!RATE_MODES.includes(o.rm)) o.rm = DEF.rm;
    if (o.ls !== '1' || SUBPRIME) o.ls = '';
    o.cs = Math.min(850, Math.max(300, Math.round(o.cs)));
    o.t = closest(o.t, o.tm);
    Object.keys(CFG_KEY).forEach(k => { if (isLocked(k)) o[k] = cfg(k); });
    return o;
  }

  /* only non default, non locked values travel in the link */
  function compact(src) {
    const out = {};
    Object.keys(DEF).forEach(k => {
      if (isLocked(k)) return;
      if (JSON.stringify(src[k]) !== JSON.stringify(DEF[k])) out[k] = src[k];
    });
    return out;
  }

  /* ---------- page mode ---------- */
  /* This file is locked to one job: 'builder' (dealer page) or 'offer' (customer results page). */
  const PAGE_MODE = 'offer';
  const q = new URLSearchParams(location.search);
  const IS_OFFER = PAGE_MODE === 'offer';
  const PREVIEW = q.get('pv') === '1' || q.get('desk') === '1';
  const DESK = q.get('desk') === '1';
  let MODIFIED = false;

  function readOffer() {
    if (!q.has('p')) return null;
    try {
      const payload = JSON.parse(unb64(q.get('p')));
      const k = payload.k; delete payload.k;
      MODIFIED = !k || k !== sign(payload);
      return normalize(payload);
    } catch (e) { return null; }
  }

  let d = IS_OFFER ? readOffer() : normalize({ ...DEF, ...store.get() });
  if (d) {
    const accent = validColor(d.ac) ? d.ac.trim() : '#d70015';
    root.style.setProperty('--acc', accent);
  }

  /* ---------- deal math ---------- */
  const total = () => num(d.pr) + num(d.tx) + num(d.fe);
  const netTrade = () => num(d.ta) - num(d.tb);
  const hasTrade = () => num(d.ta) > 0 || num(d.tb) > 0;
  const rebate = () => Math.max(0, num(d.rb));
  const hasRebate = () => rebate() > 0;
  const baseFinanced = () => total() - netTrade() - rebate();
  const maxDown = () => Math.max(0, baseFinanced() - MIN_FINANCED);
  const down = () => Math.max(0, Math.min(maxDown(), num(d.dp)));
  const financed = () => Math.max(0, baseFinanced() - down());
  const tierIdx = () => { const i = TIERS.findIndex(t => d.cs >= t.min); return i < 0 ? TIERS.length - 1 : i; };
  const rate = () => d.rm === 't' ? num(d.rt[tierIdx()], 0) : num(d.ra);
  const pay = (p, apr, n) => { if (p <= 0) return 0; const r = apr / 100 / 12; return r ? p * r / (1 - Math.pow(1 + r, -n)) : p / n; };
  const monthly = () => pay(financed(), rate(), d.t);
  const downFor = target => {
    const r = rate() / 100 / 12, n = d.t;
    const f = r ? target * (1 - Math.pow(1 + r, -n)) / r : target * n;
    return Math.max(0, Math.min(maxDown(), baseFinanced() - f));

    const m = String(d.lm || '').trim(), n = Number(m.replace(/,/g, ''));
    return m === '' ? '' : (Number.isFinite(n) ? n.toLocaleString('en-US') : m) + ' miles per year';
  };
  const leaseOffer = (t, p) => t + ' months at ' + money(leasePay(t, p)) + '/mo with ' + money(leaseDown()) + ' down' + (leaseMiles() ? ', ' + leaseMiles() : '');

  const leaseDefaults = () => Object.fromEntries(LEASE_KEYS.map(k => [k, clone(DEF[k])]));

  function rows() {
    const r = [

      ['Sales tax', money(d.tx)],
      ['Title, registration and dealer fees', money(d.fe)],

    ];

    if (leaseMiles()) r.push(['Annual mileage', leaseMiles()]);

  function summaryText() {
    return [
      'Vehicle offer' + (d.id ? ' #' + d.id : ''),

      '',

  function hook(event, extra) {
    const url = String(d.wh || '').trim();
    if (!url || PREVIEW || !/^https:\/\//i.test(url)) return;
    try {
      const body = new URLSearchParams({
        event, quote_id: d.id || '', link_modified: MODIFIED ? 'yes' : 'no',
        customer_name: d.cn || '', vehicle: vehicle(), stock: d.st || '',
        salesperson: d.sp || '', salesperson_cell: d.sc || '', dealer: dealerName(), dealer_email: d.de || '',
        monthly_payment: money(monthly()), down_payment: money(down()), amount_financed: money(financed()),
        term_months: String(d.t), apr: d.rm === 'h' ? 'hidden' : pct(rate()), credit_score: d.rm === 't' ? String(d.cs) : '',
        trade_allowance: money(d.ta), trade_balance_owed: money(d.tb),
        rebate: hasRebate() ? money(rebate()) : '', rebate_line: hasRebate() ? 'Rebate: ' + money(rebate()) : '',
        lease_quote: hasLease() ? leaseQuote() : '',
        offer_url: location.href, timestamp: new Date().toISOString(), ...(extra || {})
      });
      fetch(url, { method: 'POST', mode: 'no-cors', keepalive: true, body }).catch(() => { /* alerts are optional */ });
    } catch (e) { /* alerts are optional */ }
  }

  /* ---------- range fill ---------- */
  function fill(el) {
    if (!el) return;
    const min = +el.min || 0, max = +el.max || 100, v = +el.value;
    const p = max > min ? ((v - min) / (max - min)) * 100 : 0;
    const track = el.closest('.ec-paybox') ? '#2a2a2e' : '#e3e3e8';
    el.style.background = 'linear-gradient(90deg,var(--acc) ' + p + '%,' + track + ' ' + p + '%)';
  }

  /* ================= DEALER BUILDER ================= */
  let lastSig = '';
  function linkFor(mode) {
    const src = hasLease() ? d : { ...d, ...leaseDefaults() };
    const sig = canon(compact({ ...src, id: '' }));
    if (!d.id || sig !== lastSig) { d.id = newId(); lastSig = sig; }
    const payload = compact({ ...src, id: d.id });
    payload.k = sign(payload);
    const extra = mode === 'preview' ? '&pv=1' : mode === 'desk' ? '&desk=1' : '';
    return location.origin + path() + '?proposal=1' + extra + '&p=' + b64(JSON.stringify(payload));
  }

  function copyText(text, btn, label) {
    const done = () => { if (btn) { btn.textContent = 'Copied'; setTimeout(() => { btn.textContent = label; }, 2000); } };
    if (navigator.clipboard) { navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done)); }
    else fallbackCopy(text, done);
  }
  function fallbackCopy(text, done) {
    const t = document.createElement('textarea'); t.value = text; t.style.position = 'fixed'; t.style.opacity = '0';
    document.body.appendChild(t); t.select();
    try { document.execCommand('copy'); done(); } catch (e) { window.prompt('Copy your quote:', text); }
    t.remove();
  }

    let rateCtrl = '';
    if (d.rm === 't') rateCtrl =
      '<div class="ec-ctrl"><div class="ec-ctrl-head"><span>Credit score</span><b id="ec-cs"></b></div>' +
      '<input id="ec-cs-r" type="range" min="500" max="850" step="10" value="' + d.cs + '"><div class="ec-fine" id="ec-cs-note"></div></div>';
    else if (d.rm === 'f') rateCtrl =
      '<div class="ec-ctrl"><div class="ec-ctrl-head"><span>Interest rate</span><b>' + pct(d.ra) + ' APR</b></div><div class="ec-fine">Rate set by ' + esc(dealerName()) + '</div></div>';

    const termCtrl = d.tm.length === 1
      ? '<div class="ec-ctrl"><div class="ec-ctrl-head"><span>Finance term</span><b>' + d.t + ' months</b></div><div class="ec-fine">Term set by ' + esc(dealerName()) + '</div></div>'
      : '<div class="ec-ctrl"><div class="ec-ctrl-head"><span>Finance term</span><b id="ec-tv"></b></div><div class="ec-terms">' + d.tm.map(t => '<button type="button" data-t="' + t + '">' + t + '</button>').join('') + '</div></div>';

    const tradeCtrl = hasTrade()
      ? '<div class="ec-ctrl"><div class="ec-ctrl-head"><span>Your trade</span><b id="ec-trade-head"></b></div><div class="ec-tradebox">' +
        '<span>Trade allowance</span><b>' + money(d.ta) + '</b><span>Balance owed</span><b>' + money(d.tb) + '</b></div></div>'
      : '';

    const moneyInput = (id, label) => '<label class="ec-money">$<input id="' + id + '" class="ec-numin" type="number" inputmode="numeric" min="0" step="100" aria-label="' + label + '"></label>';
    const leaseCard = hasLease()
      ? '<div class="ec-card ec-lease"><div class="ec-lease-head"><h3>Lease option</h3>' + (leaseMiles() ? '<span>' + esc(leaseMiles()) + '</span>' : '') + '</div>' +
        '<div class="ec-ctrl"><div class="ec-ctrl-head"><span>Lease down payment</span>' + moneyInput('ec-ldv', 'Lease down payment') + '</div>' +
        '<input id="ec-ld-r" type="range" min="0" step="100"></div>' +
        '<div class="ec-lterms">' + leaseTerms().map(([t], i) => '<div class="ec-lterm"><small>' + t + ' months</small><strong id="ec-lp' + i + '"></strong>' +
          '<div class="ec-fine">Estimated monthly lease payment</div>' +
          (DESK ? '' : '<button type="button" class="ec-btn ec-btn--acc ec-btn--block" data-lease="' + i + '">I want this lease</button>') +
          (canText() ? '<a class="ec-btn ec-btn--ghost ec-btn--block" data-lease-text="' + i + '" href="#">Text this lease to my salesperson</a>' : '') + '</div>').join('') +
        '</div></div>'
      : '';

    const rep = (d.sp || d.sc || d.de)
      ? '<div class="ec-card ec-rep"><h3>' + (d.sp ? 'Your salesperson' : 'Questions?') + '</h3><p>' +
        (d.sp ? '<b style="color:#0b0b0d">' + esc(d.sp) + '</b><br>' : '') + esc(dealerName()) +
        (d.sc ? '<br>' + esc(d.sc) : '') + (d.de ? '<br>' + esc(d.de) : '') + '</p>' +
        (canText() ? '<a class="ec-btn ec-btn--acc ec-btn--block" id="ec-text2" href="' + smsHref() + '">Text ' + esc(d.sp ? d.sp.split(' ')[0] : 'my salesperson') + '</a>' : '') +
        '</div>'
      : '';

    root.innerHTML =
      '<div class="ec-offer' + (DESK ? ' ec-desk' : '') + '">' +
        '<div class="ec-bar' + barStyle() + '>' + logo + '<b>' + esc(dealerName()) + '</b><span>Personalized vehicle offer</span></div>' +
        (MODIFIED ? '<div class="ec-alert">Heads up: this offer link was changed after it was sent. ' + esc(dealerName()) + ' will confirm all numbers with you.</div>' : '') +
        '<div class="ec-hero"><div><div class="ec-kicker">Hello, ' + esc(d.cn || 'there') + '</div>' +
          '<h1>Your ' + esc(vehicle() || 'next vehicle') + '.</h1><p class="ec-sub">' + det + '</p></div>' +
          '<div class="ec-total"><small>Total price</small><strong>' + money(total()) + '</strong><small>Price ' + money(d.pr) + '  &middot;  Tax and fees ' + money(num(d.tx) + num(d.fe)) + '</small></div></div>' +
        '<div class="ec-main">' +
          '<div class="ec-paybox">' +
            '<div class="ec-kicker">Your estimated payment</div>' +
            '<div class="ec-big" id="ec-pay"></div>' +
            '<p>Slide to the payment that works for you. Your down payment updates automatically.</p>' +
            '<label for="ec-pay-r"><span>Target monthly payment</span><span id="ec-pay-lbl"></span></label>' +
            '<input id="ec-pay-r" type="range" step="5">' +
            '<div class="ec-mini"><span>Down payment</span><b id="ec-m-down"></b>' +
              (hasRebate() ? '<span>Rebate</span><b>-' + money(rebate()) + '</b>' : '') +
              '<span>Amount financed</span><b id="ec-m-fin"></b>' +
              (d.rm !== 'h' ? '<span>APR</span><b id="ec-m-apr"></b>' : '') + '<span>Term</span><b id="ec-m-term"></b></div>' +
            (DESK ? '' :
              '<button type="button" class="ec-btn ec-btn--acc ec-btn--block" id="ec-lock">Lock in this payment</button>' +
              (canText() ? '<a class="ec-btn ec-btn--light ec-btn--block" id="ec-text" href="#">Text this deal to my salesperson</a>' : '')) +
            '<button type="button" class="ec-btn ec-btn--light ec-btn--block" id="ec-pdf">Save this offer as a PDF</button>' +
          '</div>' +
          '<div class="ec-controls">' + rateCtrl + termCtrl +
            '<div class="ec-ctrl"><div class="ec-ctrl-head"><span>Down payment</span>' + moneyInput('ec-dv', 'Down payment') + '</div><input id="ec-down-r" type="range" min="0" step="100"></div>' +
            tradeCtrl +
          '</div>' +
        '</div>' +
        leaseCard +
        '<div id="ec-fallback-slot"></div>' +
        '<div class="ec-below">' +
          '<div class="ec-card ec-breakdown"><h3>Deal breakdown</h3><table id="ec-table"></table></div>' +
          rep +
        '</div>' +
        '<div class="ec-disc"><strong>Important financing estimate disclosure</strong><br>' + esc(disclaimer()) + '</div>' +
        '<div class="ec-powered"><img src="' + LOGO + '" alt="">Powered by RockstarAI</div>' +
      '</div>';

    const $ = s => root.querySelector(s);
    const payR = $('#ec-pay-r'), downR = $('#ec-down-r'), csR = $('#ec-cs-r'), dvIn = $('#ec-dv');
    const ldR = $('#ec-ld-r'), ldIn = $('#ec-ldv');
    /* typed amounts are left alone while the box has focus and normalized when it loses focus */
    const syncInput = (el, v) => { if (el && document.activeElement !== el) el.value = Math.round(v); };

    function update() {
      d.dp = down();
      const p = monthly();
      const minP = pay(baseFinanced() - maxDown(), rate(), d.t);
      const maxP = pay(baseFinanced(), rate(), d.t);
      $('#ec-pay').innerHTML = money(p) + '<small> /mo</small>';
      payR.min = Math.floor(minP / 5) * 5; payR.max = Math.max(+payR.min + 5, Math.ceil(maxP / 5) * 5);
      payR.value = Math.min(maxP, Math.max(minP, p));
      $('#ec-pay-lbl').textContent = money(p);
      downR.max = Math.max(0, Math.floor(maxDown())); downR.value = d.dp;
      syncInput(dvIn, d.dp);
      $('#ec-m-down').textContent = money(d.dp);
      $('#ec-m-fin').textContent = money(financed());
      if ($('#ec-m-apr')) $('#ec-m-apr').textContent = pct(rate());
      $('#ec-m-term').textContent = d.t + ' months';
      if ($('#ec-tv')) $('#ec-tv').textContent = d.t + ' months';
      root.querySelectorAll('[data-t]').forEach(b => b.classList.toggle('on', +b.dataset.t === d.t));
      if (csR) {
        const tier = TIERS[tierIdx()];
        $('#ec-cs').textContent = d.cs + '  ' + tier.label;
        $('#ec-cs-note').textContent = tier.label + ' credit (' + tier.range + ') estimated at ' + pct(rate()) + ' APR';
      }
      if ($('#ec-trade-head')) {
        const nt = netTrade();
        $('#ec-trade-head').textContent = nt >= 0 ? money(nt) + ' equity' : money(-nt) + ' owed over value';
      }
      $('#ec-table').innerHTML = rowsHtml(rows());
      const t1 = $('#ec-text'); if (t1) t1.href = smsHref();
      const t2 = $('#ec-text2'); if (t2) t2.href = smsHref();
      [payR, downR, csR].forEach(fill);
    }

    payR.oninput = () => { d.dp = downFor(num(payR.value)); update(); };
    downR.oninput = () => { d.dp = num(downR.value); update(); };
    dvIn.addEventListener('input', () => { d.dp = num(dvIn.value, 0); update(); });
    dvIn.addEventListener('change', () => { dvIn.value = Math.round(d.dp); });

    function leaseUpdate() {
      leaseDownNow = leaseDown();
      ldR.max = leaseMaxDown(); ldR.value = leaseDownNow;
      syncInput(ldIn, leaseDownNow);
      leaseTerms().forEach(([t, p], i) => {
        $('#ec-lp' + i).innerHTML = money(leasePay(t, p)) + '<em> /mo</em>';
        const tx = root.querySelector('[data-lease-text="' + i + '"]'); if (tx) tx.href = leaseSmsHref(t, p);
      });
      fill(ldR);
    }

    const leaseFields = (t, p) => ({
      lease_term: t + ' months', lease_payment: money(leasePay(t, p)), lease_down: money(leaseDown()),
      lease_miles: leaseMiles(), lease_line: 'Lease: ' + leaseOffer(t, p)
    });

    function requestLease([t, p]) {
      const text = 'I want this lease: ' + leaseOffer(t, p) + '.\n\n' + summaryText();
      hook('lease_requested', leaseFields(t, p));
      if (d.de) {
        const subj = encodeURIComponent('I want to lease: ' + (vehicle() || 'vehicle') + ', ' + t + ' months' + (d.id ? ' (Quote #' + d.id + ')' : ''));
        location.href = 'mailto:' + encodeURIComponent(d.de) + '?subject=' + subj + '&body=' + encodeURIComponent(text + '\n\nPlease contact me to finalize this lease.');
      }
      setTimeout(() => showFallback(text, ''), 900);
    }

    if (ldR) {
      ldR.oninput = () => { leaseDownNow = num(ldR.value); leaseUpdate(); };
      ldIn.addEventListener('input', () => { leaseDownNow = num(ldIn.value, 0); leaseUpdate(); });
      ldIn.addEventListener('change', () => { ldIn.value = Math.round(leaseDown()); });
      root.querySelectorAll('[data-lease]').forEach(b => { b.onclick = () => requestLease(leaseTerms()[+b.dataset.lease]); });
      root.querySelectorAll('[data-lease-text]').forEach(a => a.addEventListener('click', () => hook('text_clicked', leaseFields(...leaseTerms()[+a.dataset.leaseText]))));
      leaseUpdate();
    }
    if (csR) csR.oninput = () => { d.cs = num(csR.value, 720); update(); };
    root.querySelectorAll('[data-t]').forEach(b => { b.onclick = () => { d.t = num(b.dataset.t); update(); }; });
    $('#ec-pdf').onclick = savePdf;

    const lock = $('#ec-lock');
    if (lock) lock.onclick = () => {
      hook('quote_requested');
      if (d.de) {
        const subj = encodeURIComponent('I want to lock in my offer: ' + (vehicle() || 'vehicle') + (d.id ? ' (Quote #' + d.id + ')' : ''));
        const body = encodeURIComponent(summaryText() + '\n\nPlease contact me to finalize this deal.');
        location.href = 'mailto:' + encodeURIComponent(d.de) + '?subject=' + subj + '&body=' + body;
      }
      setTimeout(() => showFallback(summaryText(), canText() ? smsHref() : ''), 900);
    };
    root.querySelectorAll('#ec-text,#ec-text2').forEach(a => a.addEventListener('click', () => hook('text_clicked')));

    /* sms is the pre-filled text link for this request, or '' to offer copy and email only */
    function showFallback(text, sms) {
      const slot = $('#ec-fallback-slot');
      slot.innerHTML = '<div class="ec-card ec-fallback"><h3>' + (d.de ? 'Did your email open?' : 'Send your offer to the dealer') + '</h3>' +
        '<p>' + (d.de ? 'If your email app did not open, copy your offer and send it to <b style="color:#0b0b0d">' + esc(d.de) + '</b>' : 'Copy your offer and send it to ' + esc(dealerName())) +
        (sms ? ', or text it straight to ' + esc(d.sp || 'your salesperson') + '.' : '.') + '</p>' +
        '<div class="ec-actions"><button type="button" class="ec-btn ec-btn--acc" id="ec-copyq">Copy my offer</button>' +
        (sms ? '<a class="ec-btn ec-btn--ghost" href="' + sms + '">Text ' + esc(d.sp ? d.sp.split(' ')[0] : 'my salesperson') + '</a>' : '') +
        (d.de ? '<a class="ec-btn ec-btn--ghost" href="mailto:' + esc(d.de) + '">Email ' + esc(dealerName()) + '</a>' : '') + '</div></div>';
      const c = $('#ec-copyq');
      c.onclick = () => copyText(text, c, 'Copy my offer');
      slot.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    update();

    /* quote opened alert: once per browser session per quote */
    try {
      const key = 'rsec-opened-' + d.id;
      if (!sessionStorage.getItem(key)) { sessionStorage.setItem(key, '1'); hook('quote_opened'); }
    } catch (e) { hook('quote_opened'); }
  }

  function invalid() {
    root.innerHTML = '<div class="ec-offer"><div class="ec-empty"><h1>This offer link is incomplete.</h1>' +
      '<p>Part of the link may have been cut off. Please ask your salesperson to send it again.</p></div>' +
      '<div class="ec-powered"><img src="' + LOGO + '" alt="">Powered by RockstarAI</div></div>';
  }

  try {
    if (PAGE_MODE === 'builder') builder();
    else if (d) offer();
    else invalid();
  } catch (e) {
    root.innerHTML = '<div style="font:15px/1.5 Arial,sans-serif;max-width:640px;margin:40px auto;padding:20px 24px;border:2px solid #d70015;border-radius:14px">' +
      '<b>The calculator hit an error.</b><br>Please send this message to Rockstar support: ' + esc(e && e.message) + '</div>';
  }
})();
</script>
